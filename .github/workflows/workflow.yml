name: Build tagged release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require tag and project version to agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match project version v{version}")
          PY

      - name: Build and validate PEP 517 artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Upload validated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tetris-ballistic-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      # Public publication intentionally remains disabled until the S5 trusted
      # publishing/OIDC gate is implemented and the Unreleased entry is closed.
